services:
  frontend:
    build:
      context: ../Pi-Front-End
      dockerfile: Dockerfile

    image: aticurando-frontend:1.0

    ports:
      - "5173:80"

    depends_on:
      api:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    restart: on-failure


  api:
    build:
      context: .
      dockerfile: Dockerfile

    image: aticurando-api:1.0

    ports:
      - "3002:3002"

    env_file:
      - .env

    environment:
      PORT: 3002
      MONGO_URI: mongodb://mongo:27017/aticurando

    depends_on:
      mongo:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3002/aticurando/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: on-failure


  mongo:
    image: mongo:8.0

    volumes:
      - mongo_data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped


volumes:
  mongo_data: